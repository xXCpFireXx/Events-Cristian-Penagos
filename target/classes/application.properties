spring.application.name=UserStory-1
spring.profiles.active=jpa

# Settings H2 Database
spring.datasource.url=jdbc:h2:mem:events_venue_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user1
spring.datasource.password=user123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuraci�n JWT
# Esta clave debe ser muy larga y secreta (m�nimo 256 bits para HS256)
jwt.secret=UnaClaveMuySecretaYLoSuficientementeLargaParaQueSeaSegura123456
# Tiempo de expiraci�n: 24 horas (en milisegundos: 1000 * 60 * 60 * 24)
jwt.expiration=86400000

# --- Configuraci�n de Actuator y M�tricas ---

# Exponer los endpoints de salud, info y m�tricas de Prometheus
management.endpoints.web.exposure.include=health,info,prometheus

# Mostrar detalles completos de salud (espacio en disco, conexi�n a BD)
management.endpoint.health.show-details=always

# Agregar el nombre de la app a las m�tricas (�til para Prometheus)
management.metrics.tags.application=${spring.application.name}
