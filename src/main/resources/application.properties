spring.application.name=UserStory-1
spring.profiles.active=jpa

# Settings H2 Database
spring.datasource.url=jdbc:h2:mem:events_venue_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user1
spring.datasource.password=user123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración JWT
# Esta clave debe ser muy larga y secreta (mínimo 256 bits para HS256)
jwt.secret=UnaClaveMuySecretaYLoSuficientementeLargaParaQueSeaSegura123456
# Tiempo de expiración: 24 horas (en milisegundos: 1000 * 60 * 60 * 24)
jwt.expiration=86400000
